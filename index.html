<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Current Weather App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #9face6);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .weather-card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      width: 320px;
      max-width: calc(100vw - 80px);
      box-shadow: 0 8px 25px #0002;
    }

    h1 { color: #333; font-size: 25px; }

    input, button {
      padding: 12px;
      margin: 5px 0;
      width: 100%;
      box-sizing: border-box;
      border-radius: 8px;
      font-size: 15px;
    }

    input { border: 1px solid #ccc; }

    button {
      border: none;
      background: #5478d5;
      color: white;
      cursor: pointer;
    }

    button:hover { background: #385bb5; }

    #temperature {
      font-size: 45px;
      font-weight: bold;
      margin: 15px 0;
    }

    #icon { font-size: 50px; }
    #details { line-height: 1.8; color: #444; }
    #status { color: #555; font-size: 13px; }
  </style>
</head>
<body>
  <div class="weather-card">
    <h1>🌤️ Weather App</h1>

    <input
      type="text"
      id="city"
      placeholder="Enter city (e.g. Yogyakarta)"
      value="Yogyakarta"
    >

    <button onclick="getWeather()">Check Weather</button>

    <p id="status">Enter a city to check the weather.</p>

    <div id="weather" hidden>
      <h2 id="location"></h2>
      <div id="icon">🌤️</div>
      <div id="temperature"></div>
      <p id="description"></p>
      <div id="details"></div>
    </div>
  </div>

  <script>
    const weatherDescriptions = {
      0: ["Clear sky", "☀️"],
      1: ["Mainly clear", "🌤️"],
      2: ["Partly cloudy", "⛅"],
      3: ["Overcast", "☁️"],
      45: ["Foggy", "🌫️"],
      48: ["Depositing rime fog", "🌫️"],
      51: ["Light drizzle", "🌦️"],
      53: ["Moderate drizzle", "🌦️"],
      55: ["Dense drizzle", "🌧️"],
      61: ["Light rain", "🌦️"],
      63: ["Moderate rain", "🌧️"],
      65: ["Heavy rain", "🌧️"],
      71: ["Light snow", "🌨️"],
      73: ["Moderate snow", "🌨️"],
      75: ["Heavy snow", "❄️"],
      80: ["Rain showers", "🌦️"],
      81: ["Moderate rain showers", "🌧️"],
      82: ["Heavy rain showers", "⛈️"],
      95: ["Thunderstorm", "⛈️"],
      96: ["Thunderstorm with hail", "⛈️"],
      99: ["Severe thunderstorm with hail", "⛈️"]
    };

    async function getWeather() {
      const city = document.getElementById("city").value.trim();
      const status = document.getElementById("status");
      const weather = document.getElementById("weather");

      if (!city) {
        status.textContent = "Please enter a city name.";
        weather.hidden = true;
        return;
      }

      status.textContent = "Loading weather...";
      weather.hidden = true;

      try {
        // Find the city's geographical coordinates.
        const geoURL =
          "https://geocoding-api.open-meteo.com/v1/search?name=" +
          encodeURIComponent(city) +
          "&count=1&language=en&format=json";

        const geoResponse = await fetch(geoURL);

        if (!geoResponse.ok) {
          throw new Error("Could not search for the city.");
        }

        const geoData = await geoResponse.json();

        if (!geoData.results || geoData.results.length === 0) {
          throw new Error("City not found. Try another city name.");
        }

        const place = geoData.results[0];

        // Request the current weather.
        const params = new URLSearchParams({
          latitude: place.latitude,
          longitude: place.longitude,
          current: [
            "temperature_2m",
            "relative_humidity_2m",
            "apparent_temperature",
            "is_day",
            "precipitation",
            "weather_code",
            "wind_speed_10m"
          ].join(","),
          timezone: "auto"
        });

        const response = await fetch(
          "https://api.open-meteo.com/v1/forecast?" + params
        );

        if (!response.ok) {
          throw new Error("Could not retrieve weather data.");
        }

        const data = await response.json();
        const current = data.current;

        const [description, icon] =
          weatherDescriptions[current.weather_code] ||
          ["Unknown conditions", "🌍"];

        document.getElementById("location").textContent =
          place.name + ", " + (place.country || "");

        document.getElementById("icon").textContent =
          current.is_day ? icon : "🌙";

        document.getElementById("temperature").textContent =
          current.temperature_2m + "°C";

        document.getElementById("description").textContent =
          description;

        document.getElementById("details").innerHTML = `
          🌡️ Feels like: ${current.apparent_temperature}°C<br>
          💧 Humidity: ${current.relative_humidity_2m}%<br>
          💨 Wind speed: ${current.wind_speed_10m} km/h<br>
          🌧️ Precipitation: ${current.precipitation} mm<br>
          🕒 Local time: ${current.time.replace("T", " ")}
        `;

        weather.hidden = false;
        status.textContent = "Current weather retrieved successfully.";

      } catch (error) {
        status.textContent = error.message ||
          "Something went wrong. Please try again.";
        weather.hidden = true;
      }
    }

    // Press Enter to search.
    document.getElementById("city").addEventListener("keydown", event => {
      if (event.key === "Enter") getWeather();
    });

    // Load weather for the default city.
    getWeather();
  </script>
</body>
</html>
